<title>Govt. College of Engineering, Kannur — Exam Seating Allocator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef1f6;--surface:#fff;--surface2:#f4f6fa;
  --border:#dde2ea;--border2:#c3cad6;
  --text:#161b25;--text2:#525a6b;--text3:#8991a3;
  --accent:#152a52;--accent-deep:#0d1b38;--accent2:#2f66d0;--accent-light:#e9f0fd;
  --gold:#c9a227;--gold-light:#fbf3da;
  --red:#c0392b;--red-light:#fdeceb;--green:#0f7a4c;--green-light:#e5f7ee;--amber:#96660a;--amber-light:#fdf3dc;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 16px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.14);
  --radius:12px;
}
body{font-family:'Inter',Arial,sans-serif;background:
  radial-gradient(1200px 500px at 15% -10%, #eef3fc 0%, transparent 60%),
  radial-gradient(1000px 500px at 100% 0%, #f4efe0 0%, transparent 55%),
  var(--bg);color:var(--text);min-height:100vh}
h1,h2,.font-display{font-family:'Playfair Display',Georgia,serif}
header{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%);color:#fff;padding:1.1rem 2rem;border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
header::after{content:'';position:absolute;inset:0;background:
  radial-gradient(600px 200px at 90% -40%, rgba(201,162,39,.25), transparent 60%);
  pointer-events:none}
header .container{position:relative;display:flex;align-items:center;gap:.9rem;max-width:1160px;margin:0 auto;padding:0 1.5rem}
header .mark{width:52px;height:52px;border-radius:10px;background:#fff;border:1.5px solid rgba(201,162,39,.55);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:2px}
header .mark img{width:100%;height:100%;object-fit:contain}
header h1{font-size:1.35rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
header p{font-size:.78rem;opacity:.78;margin-top:.15rem;font-family:'Inter',sans-serif;letter-spacing:.02em}
.container{max-width:1160px;margin:0 auto;padding:1.75rem 1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem 1.6rem;box-shadow:var(--shadow-sm);margin-bottom:1.4rem;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow)}
.card-title{font-size:.78rem;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;display:flex;align-items:center;gap:.55rem}
.badge{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;box-shadow:0 2px 6px rgba(47,102,208,.35)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.25rem;margin-bottom:1.5rem}
.steps .card{border-top:3px solid var(--accent2)}
.drop-zone{border:1.5px dashed var(--border2);border-radius:10px;padding:1.3rem 1rem;text-align:center;cursor:pointer;transition:all .2s;font-size:.8rem;color:var(--text3);position:relative;margin-bottom:.55rem;background:var(--surface2)}
.drop-zone:hover{border-color:var(--accent2);background:var(--accent-light);color:var(--accent2)}
.dz-icon{font-size:1.6rem;margin-bottom:.3rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .7rem;border-radius:20px;font-size:.74rem;font-weight:600}
.chip-ok{background:var(--green-light);color:var(--green)}
.chip-err{background:var(--red-light);color:var(--red)}
.chip-wait{background:var(--surface2);color:var(--text3)}
.btn{font-family:'Inter',sans-serif;font-size:.84rem;font-weight:700;padding:.6rem 1.25rem;border:none;border-radius:8px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;letter-spacing:.01em;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 3px 10px rgba(21,42,82,.25)}.btn-primary:hover{box-shadow:0 5px 16px rgba(21,42,82,.35);transform:translateY(-1px)}
.btn-primary:disabled{background:#aab1bf;cursor:not-allowed;box-shadow:none;transform:none}
.btn-green{background:linear-gradient(135deg,#1a8f5a,var(--green));color:#fff;box-shadow:0 3px 10px rgba(15,122,76,.25)}.btn-green:hover{box-shadow:0 5px 16px rgba(15,122,76,.35);transform:translateY(-1px)}
.btn-green:disabled{background:#aab1bf;cursor:not-allowed;box-shadow:none;transform:none}
.btn-sm{padding:.36rem .8rem;font-size:.76rem}
.btn-danger{background:var(--red-light);color:var(--red);border:1px solid #f3c9c5}.btn-danger:hover{background:#f9d8d5}
.btn-ghost{background:transparent;color:var(--accent2);border:1.5px solid var(--accent2)}.btn-ghost:hover{background:var(--accent-light)}
.manual-grid{display:grid;grid-template-columns:1fr 70px 48px 48px auto;gap:.4rem;margin:.5rem 0;align-items:center}
.rooms-table-wrap{margin-top:.65rem;overflow-x:auto;border-radius:8px}
.rooms-table,.data-table{width:100%;border-collapse:collapse;font-size:.8rem}
.rooms-table th,.data-table th{background:var(--surface2);color:var(--text2);font-weight:700;padding:.5rem .7rem;text-align:left;border-bottom:2px solid var(--border);font-size:.71rem;text-transform:uppercase;letter-spacing:.05em}
.rooms-table td,.data-table td{padding:.42rem .7rem;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.rooms-table tr:hover td,.data-table tr:hover td{background:var(--accent-light)}
.rooms-table input,select,input[type=text],input[type=number],input[type=password]{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:.32rem .5rem;font-size:.8rem;font-family:'Inter',sans-serif;background:var(--surface);color:var(--text);transition:border-color .15s}
.rooms-table input:focus,select:focus,input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent-light)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.75rem;margin:1.1rem 0}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem .9rem;text-align:center;box-shadow:var(--shadow-sm)}
.stat-val{font-size:1.55rem;font-weight:800;color:var(--accent);font-family:'Playfair Display',serif}
.stat-lbl{font-size:.68rem;color:var(--text3);margin-top:.15rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:1.4rem;margin-top:1.1rem}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.room-card:hover{box-shadow:var(--shadow)}
.room-header{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;padding:.65rem .95rem;font-weight:700;font-size:.86rem;display:flex;justify-content:space-between;align-items:center}
.room-header span{font-size:.73rem;opacity:.85}
.seat-grid-wrap{padding:.7rem;overflow-x:auto}
.seat-col-labels{display:flex;padding-left:22px;gap:2px;margin-bottom:2px}
.seat-col-lbl{text-align:center;font-size:.58rem;color:var(--text3);font-weight:700}
.seat-row{display:flex;gap:2px;margin-bottom:2px;align-items:stretch}
.row-lbl{width:20px;font-size:.58rem;color:var(--text3);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.seat{border:1px solid var(--border);border-radius:6px;padding:.18rem .28rem;display:flex;flex-direction:column;justify-content:center;min-height:46px;flex:1;min-width:0;transition:transform .1s}
.seat.filled:hover{transform:scale(1.04)}
.seat.empty{background:var(--surface2);border-style:dashed}
.seat-sid{font-size:.52rem;color:var(--text3);font-weight:700;line-height:1}
.seat-reg{font-weight:700;color:var(--text);font-size:.58rem;word-break:break-all;line-height:1.2;margin:.08rem 0}
.seat-sub{font-size:.5rem;padding:.06rem .28rem;border-radius:3px;font-weight:700;color:#fff;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin:.65rem 0;font-size:.74rem;align-items:center}
.legend-item{display:flex;align-items:center;gap:.28rem}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.1rem;gap:.2rem}
.tab{padding:.55rem 1.1rem;font-size:.82rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:var(--text3);transition:all .2s;margin-bottom:-2px;user-select:none;text-decoration:none;border-radius:6px 6px 0 0}
.tab:hover{color:var(--accent2);background:var(--surface2)}
.tab.active{color:var(--accent);border-bottom-color:var(--gold)}
.tab-panel{display:none}.tab-panel.active{display:block}
.course-pill{padding:.1rem .4rem;border-radius:4px;font-size:.67rem;font-weight:700}
.msg{padding:.65rem .9rem;border-radius:8px;font-size:.81rem;margin:.4rem 0}
.msg-err{background:var(--red-light);color:var(--red);border:1px solid #f3c9c5}
.msg-ok{background:var(--green-light);color:var(--green);border:1px solid #bfe8d3}
.msg-warn{background:var(--amber-light);color:var(--amber);border:1px solid #efd89a}
.section-title{font-size:1.05rem;color:var(--text);font-weight:700;margin:1.2rem 0 .6rem;padding-bottom:.35rem;border-bottom:2px solid var(--gold);font-family:'Playfair Display',serif}
.row-actions{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;margin-bottom:.85rem}
.divider-label{text-align:center;font-size:.75rem;color:var(--text3);position:relative;margin:1rem 0}
.divider-label::before,.divider-label::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--border)}
.divider-label::before{left:0}.divider-label::after{right:0}
nav.main-nav{background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(15,23,42,.04);position:sticky;top:0;z-index:10}
nav.main-nav .container{display:flex;gap:.25rem;padding:.5rem 1.5rem;flex-wrap:wrap}
nav.main-nav a{padding:.55rem 1rem;border-radius:7px;color:var(--text2);font-size:.83rem;font-weight:700;text-decoration:none;cursor:pointer;transition:all .15s}
nav.main-nav a:hover{background:var(--surface2);color:var(--accent)}
nav.main-nav a.active{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}
table.data-table td form{display:inline}
.db-note{font-size:.8rem;color:var(--text2);line-height:1.6}
.db-note code{background:var(--surface2);padding:.15rem .4rem;border-radius:4px;border:1px solid var(--border)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){.steps{grid-template-columns:1fr}.manual-grid{grid-template-columns:1fr 1fr}header .container{padding:0 .5rem}}
  .seat[draggable=true]{cursor:grab}
  .seat.sel{outline:3px solid #c9a227;outline-offset:-2px;box-shadow:0 0 0 3px rgba(201,162,39,.25)}
  .seat.dragover{outline:3px dashed var(--accent2);outline-offset:-2px;background:var(--accent-light)!important}
  .seat.dragging{opacity:.4}
  .swap-hint{font-size:.78rem;color:var(--text2);background:var(--gold-light);border:1px solid #ecd98f;border-radius:8px;padding:.5rem .8rem;margin:.2rem 0 .9rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
</style>
</head>

const DB_NAME = 'examSeatingAllocatorDB';
const STORE_NAME = 'kv';
let _dbPromise = null;

function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'key' });
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}
async function dbGet(key, fallback){
  try{
    const db = await openDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : fallback);
      req.onerror = () => resolve(fallback);
    });
  }catch(e){ console.error('db get failed', key, e); return fallback; }
}
async function dbSet(key, value){
  try{
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put({ key, value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error('db set failed', key, e); }
}

const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const PALETTE = [
  '#1a3a5c','#1d6b43','#8a2020','#8a5a0a','#5a3d7a','#2d6b6b',
  '#6b3d1d','#3d5a1d','#1d3d6b','#6b1d5a','#3d6b2d','#2d4a6b',
  '#7a1d3d','#4a6b1d','#1d4a6b','#6b4a1d',
];
function seatId(r,c){ return ALPHA[c % ALPHA.length] + (r+1); } // column letter + row number (A1, B1, C1 … / A2, B2 …)
function hexRgb(hex){
  hex = hex.replace('#','');
  return { r: parseInt(hex.substr(0,2),16)||100, g: parseInt(hex.substr(2,2),16)||100, b: parseInt(hex.substr(4,2),16)||100 };
}
function hexLight(hex){ const c=hexRgb(hex); return `rgba(${c.r},${c.g},${c.b},0.09)`; }
function courseColors(courses){
  const map = {};
  courses.forEach((c,i)=> map[c] = PALETTE[i % PALETTE.length]);
  return map;
}
function rowVal(row, keys){
  for(const k of keys){
    for(const rk in row){
      if(String(rk).trim().toLowerCase() === k.toLowerCase()) return String(row[rk] ?? '').trim();
    }
  }
  return '';
}
function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString(undefined, { day:'2-digit', month:'short', year:'numeric' });
}
function truthyFlag(v){
  const s = String(v ?? '').trim().toLowerCase();
  return ['yes','y','true','1','ill','disabled','gf','ground floor','ground'].includes(s);
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function freshState(room, presetStates){
  const preset = presetStates && presetStates[room.id];
  if(preset){
    return { room, R: room.rows, C: room.cols, grid: preset.grid, placedInRoom: { ...preset.placedInRoom }, seatsFilled: preset.seatsFilled };
  }
  return {
    room, R: room.rows, C: room.cols,
    grid: Array.from({length: room.rows}, () => new Array(room.cols).fill(null)),
    placedInRoom: {},
    seatsFilled: 0,
  };
}

// Flattens per-room grid states into the flat `assigned` array the rest of the app expects
// (idx = c*R + r, i.e. col-major storage; see seatId()/render usage below) and works out
// who didn't get seated.
function finalizeAllocation(states, studentsIn){
  const allocation = states.map(st => {
    const { room, R, C, grid } = st;
    const assigned = new Array(R*C).fill(null);
    for(let r=0; r<R; r++){
      for(let c=0; c<C; c++){
        const student = grid[r][c];
        assigned[c*R + r] = student ? { ...student, _seat: seatId(r,c), _room_id: room.id } : null;
      }
    }
    return { room, R, C, assigned };
  });

  const placedRegnos = {};
  allocation.forEach(rd => rd.assigned.forEach(a => { if(a) placedRegnos[a.regno] = true; }));
  const unplaced = studentsIn.filter(s => !placedRegnos[s.regno]);

  return { allocation, unplaced, states };
}

/* ===================== allocation algorithm (Room-by-Room, max 3 courses, contiguous roll nos) =====
   1) Rooms are filled ONE AT A TIME, in order. Because no other room touches a course while the
      current room is being filled, every course takes a single unbroken run of its
      register-number-sorted list in each room (e.g. roll 1-20 in room 1, 21-41 in room 2, ...).
      Nothing like 1-10 + 30-40 can happen inside a room.
   2) Seats are filled column by column, top to bottom. A course keeps going down the column and
      carries on into the next column it is allowed in, so its roll numbers stay consecutive.
   3) Strict neighbour rule: a seat never gets the same course as its left or right neighbour.
      (Same course directly behind in the same column is still allowed, as before.)
   4) Each room uses at most MAX_TYPES (3) courses, to keep paper collection simple. A new
      course is only brought in when the ones already in the room cannot legally take the seat.
   5) If a seat cannot be filled within those rules, it is left empty as long as there are spare
      seats overall. Only when seats are tight (every remaining seat is needed) is the 3-course cap
      relaxed - this happens naturally in the last room(s), where leftover small courses get dumped
      together. The neighbour rule is never relaxed; anyone who still cannot be seated is reported
      as unplaced.
=================================================================================================== */
const MAX_TYPES = 3;

function runAllocationColumnFill(roomsIn, studentsIn, presetStates){
  const courseOrder = [];
  const courseGroups = {};
  studentsIn.forEach(s => {
    if(!courseGroups[s.course]){ courseGroups[s.course] = []; courseOrder.push(s.course); }
    courseGroups[s.course].push(s);
  });
  courseOrder.forEach(c => courseGroups[c].sort((a,b) =>
    a.regno.localeCompare(b.regno, undefined, { numeric: true, sensitivity: 'base' })
  ));

  const remainingOf = c => courseGroups[c].length;
  const totalRemaining = () => courseOrder.reduce((n,c) => n + courseGroups[c].length, 0);
  // Largest remaining course among `pool` that is allowed at this seat (null if none).
  function largest(pool, ok){
    let best = null;
    for(const c of pool){
      if(remainingOf(c) <= 0 || !ok(c)) continue;
      if(best === null || remainingOf(c) > remainingOf(best)) best = c;
    }
    return best;
  }

  const states = roomsIn.map(room => freshState(room, presetStates));

  // Seats still open anywhere (this seat and everything after it) - used to decide whether an
  // empty seat can be afforded.
  let freeLeft = 0;
  states.forEach(st => st.grid.forEach(row => row.forEach(cell => { if(!cell) freeLeft++; })));

  for(const st of states){
    if(!totalRemaining()) break;
    // Courses already seated in this room (e.g. by the ground-floor pass) count towards the cap.
    const used = new Set();
    st.grid.forEach(row => row.forEach(cell => { if(cell) used.add(cell.course); }));

    for(let c=0; c<st.C && totalRemaining(); c++){
      let cur = null; // course currently running down this column
      for(let r=0; r<st.R && totalRemaining(); r++){
        if(st.grid[r][c]) { cur = st.grid[r][c].course; continue; } // pre-seated (ground floor)
        const left  = c > 0       ? st.grid[r][c-1] : null;
        const right = c < st.C-1  ? st.grid[r][c+1] : null;
        const clash = course => (left && left.course === course) || (right && right.course === course);
        const allowed = course => !clash(course);
        const slack = freeLeft - totalRemaining(); // spare seats we may afford to leave empty

        let pick = null;
        // a) keep the column's current course going (keeps roll numbers consecutive)
        if(cur && remainingOf(cur) > 0 && allowed(cur)) pick = cur;
        // b) another course already in this room
        if(pick === null) pick = largest([...used], allowed);
        // c) bring in a new course while the room has fewer than 3
        if(pick === null && used.size < MAX_TYPES) pick = largest(courseOrder.filter(x => !used.has(x)), allowed);
        // d) cap would be exceeded: leave the seat empty if spare seats exist, else relax the cap
        if(pick === null && slack <= 0) pick = largest(courseOrder, allowed);

        if(pick !== null){
          const student = courseGroups[pick].shift();
          st.grid[r][c] = student;
          st.seatsFilled++;
          st.placedInRoom[pick] = (st.placedInRoom[pick] || 0) + 1;
          used.add(pick);
          cur = pick;
        } else {
          cur = null; // seat left empty
        }
        freeLeft--;
      }
    }
  }

  return finalizeAllocation(states, studentsIn);
}

/* ===================== recursive backtrack: rescue unplaced students =====================
   The column-fill pass above can finish with students unplaced even though empty seats remain
   scattered across rooms — a leftover partial column, a course that ran out mid-column, etc.
   This pass makes a second attempt at seating each unplaced student:
     1) Look for any empty seat, in any room, where dropping the student in wouldn't put them
        directly beside (left/right) or in front of (row below, same column) another student
        from the same course. Sitting directly BEHIND a course-mate — the seat immediately in
        front, same column, one row up — is explicitly allowed and not treated as a conflict:
        it mirrors how the main column-fill pass already stacks the same course vertically down
        a column, and a student can't see the paper of someone seated ahead of them.
     2) If no such seat exists outright, look for an empty seat whose ONLY problem is one or two
        same-course neighbours (beside or in front), and try to recursively relocate those
        neighbours to some other safe empty seat elsewhere. If every conflicting neighbour can be
        moved clear, the seat is now safe and the unplaced student takes it. Relocation recurses
        (bounded by MAX_DEPTH) so a moved neighbour can, in turn, trigger another relocation to
        make room.
     3) If neither works after exhausting the search, the student stays genuinely unplaced —
        capacity or the anti-copy constraint itself has no solution, not just this pass.
   This never violates the left/right/front anti-copy rule; it only ever fills seats that are
   verified safe (or safely "behind a course-mate") at the moment they're filled.
================================================================================================ */
function backtrackPlaceUnplaced(states, unplaced){
  const MAX_DEPTH = 4;
  const placed = [];

  function neighborCells(st, r, c){
    const pts = [];
    if(r > 0) pts.push([r-1, c]);
    if(r < st.R-1) pts.push([r+1, c]);
    if(c > 0) pts.push([r, c-1]);
    if(c < st.C-1) pts.push([r, c+1]);
    return pts;
  }

  // Same-course neighbours that count as a real conflict — i.e. everything except the seat
  // directly in front (row-1, same column). A same-course occupant there just means the new
  // student would be seated behind their course-mate, which is fine by design.
  function conflictingNeighbors(st, r, c, course){
    return neighborCells(st, r, c).filter(([nr,nc]) => {
      if(nr === r - 1 && nc === c) return false; // seat in front — "behind a course-mate" is allowed
      const occ = st.grid[nr][nc];
      return occ && occ.course === course;
    });
  }

  function seatKey(st, r, c){ return st.room.id + ':' + r + ':' + c; }

  function placeStudent(st, r, c, student){
    st.grid[r][c] = student;
    st.seatsFilled++;
    st.placedInRoom[student.course] = (st.placedInRoom[student.course] || 0) + 1;
  }

  function vacateStudent(st, r, c){
    st.grid[r][c] = null;
    st.seatsFilled--;
  }

  // Try to move `student` (currently at fromSt/fromR/fromC, or nowhere yet if fromSt is null)
  // into any anti-copy-safe empty seat not already locked by an in-progress attempt.
  function relocateToSafeSeat(student, fromSt, fromR, fromC, depth, lockedSeats){
    for(const st of states){
      for(let r=0; r<st.R; r++){
        for(let c=0; c<st.C; c++){
          if(fromSt === st && r === fromR && c === fromC) continue;
          if(st.grid[r][c]) continue; // must be empty
          const key = seatKey(st, r, c);
          if(lockedSeats.has(key)) continue;
          if(conflictingNeighbors(st, r, c, student.course).length === 0){
            if(fromSt) vacateStudent(fromSt, fromR, fromC);
            placeStudent(st, r, c, student);
            return true;
          }
        }
      }
    }
    if(depth >= MAX_DEPTH) return false;
    // No outright-safe seat: recursively try clearing space for this student too, by
    // bumping whichever course is blocking each empty-but-conflicting seat.
    for(const st of states){
      for(let r=0; r<st.R; r++){
        for(let c=0; c<st.C; c++){
          if(fromSt === st && r === fromR && c === fromC) continue;
          if(st.grid[r][c]) continue;
          const key = seatKey(st, r, c);
          if(lockedSeats.has(key)) continue;
          const conflicts = conflictingNeighbors(st, r, c, student.course);
          if(!conflicts.length) continue;
          lockedSeats.add(key);
          const cleared = conflicts.every(([nr,nc]) => {
            const occ = st.grid[nr][nc];
            return occ && relocateToSafeSeat(occ, st, nr, nc, depth+1, lockedSeats);
          });
          if(cleared){
            if(fromSt) vacateStudent(fromSt, fromR, fromC);
            placeStudent(st, r, c, student);
            return true;
          }
          lockedSeats.delete(key);
        }
      }
    }
    return false;
  }

  unplaced.forEach(student => {
    const ok = relocateToSafeSeat(student, null, -1, -1, 0, new Set());
    if(ok) placed.push(student);
  });

  return placed;
}

const ALLOC_ALGORITHMS = {
  column: { fn: runAllocationColumnFill, label: 'Room-by-Room Column Fill (max 3 courses/room, consecutive roll nos)' },
};

// Quality metrics mirrored from the repo's report: Distribution Score (avg. distinct subjects
// per occupied room — informational) and Separation Score (avg. nearest same-subject spatial
// distance in seat-grid coordinates — higher is safer). Note: this algorithm deliberately fills
// a whole column with one course, so vertical same-course adjacency is expected by design —
// treat the Separation Score here as informational rather than a defect to fix.
function computeQualityMetrics(states){
  let totalDistinctCourses = 0, roomsWithStudents = 0;
  let sepSum = 0, sepCount = 0;
  states.forEach(st => {
    const { R, C, grid } = st;
    const coursesInRoom = new Set();
    const cells = [];
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const s = grid[r][c];
      if(s){ coursesInRoom.add(s.course); cells.push({ r, c, course: s.course }); }
    }
    if(cells.length){ totalDistinctCourses += coursesInRoom.size; roomsWithStudents++; }
    cells.forEach(cell => {
      let minDist = Infinity;
      cells.forEach(other => {
        if(other === cell || other.course !== cell.course) return;
        const d = Math.sqrt((other.r-cell.r)**2 + (other.c-cell.c)**2);
        if(d < minDist) minDist = d;
      });
      if(minDist !== Infinity){ sepSum += minDist; sepCount++; }
    });
  });
  const distributionScore = roomsWithStudents ? +(totalDistinctCourses/roomsWithStudents).toFixed(2) : 0;
  const separationScore = sepCount ? +(sepSum/sepCount).toFixed(2) : 0;
  let rating = 'Excellent';
  if(sepCount === 0) rating = 'N/A';
  else if(separationScore < 1.5) rating = 'Needs Improvement';
  else if(separationScore < 2) rating = 'Fair';
  else if(separationScore < 2.5) rating = 'Good';
  else if(separationScore < 3) rating = 'Very Good';
  return { distributionScore, separationScore, rating };
}

// Two-pass wrapper: seats ground-floor-flagged (physically ill / mobility-limited)
// students into ground-floor-flagged rooms first, then allocates everyone else into
// all rooms (including any leftover seats in those same ground-floor rooms) using the
// column-fill algorithm above.
function runFullAllocation(roomsIn, studentsIn, strategy){
  const algo = (ALLOC_ALGORITHMS[strategy] || ALLOC_ALGORITHMS.column).fn;
  const groundRooms = roomsIn.filter(r => r.groundFloor);
  const illStudents = studentsIn.filter(s => s.groundFloor);
  const otherStudents = studentsIn.filter(s => !s.groundFloor);

  let presetStates = {};
  let illUnplacedOnGround = [];

  if(illStudents.length && groundRooms.length){
    const pass1 = algo(groundRooms, illStudents);
    pass1.states.forEach(st => { presetStates[st.room.id] = st; });
    illUnplacedOnGround = pass1.unplaced;
  } else {
    illUnplacedOnGround = illStudents.slice();
  }

  const remainingStudents = [...illUnplacedOnGround, ...otherStudents];
  let pass2 = algo(roomsIn, remainingStudents, presetStates);

  // Recursive backtrack rescue pass: some students may still show as unplaced even though
  // scattered empty seats exist (partial columns, a course that ran dry mid-column, etc).
  // Try to seat each of them into any anti-copy-safe seat, recursively relocating
  // conflicting neighbours out of the way when needed.
  let rescuedCount = 0;
  if(pass2.unplaced.length){
    const rescued = backtrackPlaceUnplaced(pass2.states, pass2.unplaced);
    if(rescued.length){
      rescuedCount = rescued.length;
      const rebuilt = finalizeAllocation(pass2.states, remainingStudents);
      pass2 = { ...pass2, allocation: rebuilt.allocation, unplaced: rebuilt.unplaced };
    }
  }

  const groundFloorNote = illStudents.length ? {
    needed: illStudents.length,
    placedOnGround: illStudents.length - illUnplacedOnGround.length,
    noGroundRooms: groundRooms.length === 0,
  } : null;

  const quality = computeQualityMetrics(pass2.states);

  return { allocation: pass2.allocation, unplaced: pass2.unplaced, groundFloorNote, quality, rescuedCount };
}


/* ===================== file import (xlsx via SheetJS / csv) ===================== */
// Reads a file into a raw grid (array of arrays, no header assumed yet) so the mapping step
// can let the user pick which row actually holds the column titles — some exports have a
// title, a blank row, or a logo caption above the real header row.
function parseCsvGrid(text){
  // Keep blank interior lines as their own (empty) row so row numbers shown to the user
  // line up with the actual file — only drop a single trailing blank line from a final EOF newline.
  let lines = text.split(/\r\n|\n|\r/);
  if(lines.length && lines[lines.length-1] === '') lines = lines.slice(0, -1);
  const parseLine = (line) => {
    const out = []; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(inQ){
        if(ch === '"'){ if(line[i+1] === '"'){ cur+='"'; i++; } else inQ=false; }
        else cur += ch;
      } else {
        if(ch === '"') inQ = true;
        else if(ch === ',') { out.push(cur); cur=''; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  };
  return lines.map(parseLine);
}
function readFileAsGrid(file){
  return new Promise((resolve, reject) => {
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    if(ext === 'csv'){
      reader.onload = () => resolve(parseCsvGrid(reader.result));
      reader.readAsText(file);
    } else if(ext === 'xlsx'){
      reader.onload = () => {
        try{
          const wb = XLSX.read(reader.result, { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const grid = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          resolve(grid.map(row => row.map(cell => cell == null ? '' : String(cell))));
        }catch(e){ reject(e); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reject(new Error('Unsupported file type. Please upload .xlsx or .csv'));
    }
  });
}
// Builds { headers, rows } from the raw grid given a 1-based header row number. Blank rows
// below the header (common right before a footer, or leftover from the title block) are
// skipped rather than imported as empty records.
function deriveHeadersAndRows(grid, headerRow){
  const idx = Math.max(1, Math.min(headerRow, Math.max(grid.length,1))) - 1;
  const headerCells = grid[idx] || [];
  const headers = headerCells.map((h,i) => String(h).trim() || `Column ${i+1}`);
  const rows = grid.slice(idx+1)
    .filter(line => line.some(cell => String(cell).trim() !== ''))
    .map(line => {
      const row = {};
      headers.forEach((h,i) => { row[h] = line[i] ?? ''; });
      return row;
    });
  return { headers, rows };
}
// Best-effort guess at which of the first several grid rows is the real header row: score
// each row by how many cells match a known field alias for this import type, pick the best.
// Falls back to row 1 (the common case) when nothing scores.
function guessHeaderRow(grid, type){
  const fields = IMPORT_FIELDS[type];
  const allAliases = fields.flatMap(f => f.aliases.map(a => a.toLowerCase()));
  let best = 1, bestScore = 0;
  grid.slice(0, 10).forEach((row, i) => {
    const score = row.reduce((s,cell) => s + (allAliases.includes(String(cell).trim().toLowerCase()) ? 1 : 0), 0);
    if(score > bestScore){ bestScore = score; best = i+1; }
  });
  return best;
}

/* ===================== import: column schema mapping ===================== */
const IMPORT_FIELDS = {
  students: [
    { key:'slno', label:'Sl. No.', aliases:['Sl No','Sl. No','Sl. No.','Sl.No.','Sl.No','SlNo'], required:false },
    { key:'regno', label:'Reg. No.', aliases:['Reg. No','Reg. No.','Reg.No.','Reg.No','RegNo','Reg No','Reg No.','Register No','Register Number'], required:true },
    { key:'name', label:'Name', aliases:['Name'], required:false },
    { key:'course', label:'Sub code', aliases:['Sub code','Sub. code','Sub.code','Subject Code','Subject code','Course','Course Code'], required:true },
    { key:'subject', label:'Subject (name) — optional', aliases:['Subject','Subject Name','Subject name','Course Name'], required:false },
    { key:'groundFloor', label:'Needs Ground Floor (physically ill) — optional', aliases:['Ground Floor','GroundFloor','Physically Ill','Disability','Special Need'], required:false },
  ],
  rooms: [
    { key:'name', label:'Room name / no.', aliases:['Room No.','Room No','Room name','Room','Name'], required:true },
    { key:'session', label:'Session', aliases:['session','Session'], required:false },
    { key:'rows', label:'Rows', aliases:['Rows','rows'], required:true },
    { key:'cols', label:'Columns', aliases:['Columns','columns','Cols','cols'], required:true },
    { key:'groundFloor', label:'Ground Floor Room — optional', aliases:['Ground Floor','GroundFloor','Floor'], required:false },
  ],
};
function guessHeader(headers, aliases){
  for(const alias of aliases){
    const hit = headers.find(h => String(h).trim().toLowerCase() === alias.toLowerCase());
    if(hit) return hit;
  }
  return '';
}
async function openImportMapping(input, type){
  const file = input.files[0];
  if(!file) return;
  try{
    const grid = await readFileAsGrid(file);
    if(!grid.length){ render(); showNotice('err','The file appears to be empty.'); input.value=''; return; }
    const headerRow = guessHeaderRow(grid, type);
    const { headers, rows } = deriveHeadersAndRows(grid, headerRow);
    if(!rows.length){ render(); showNotice('err','No data rows found below the detected header row — try a different "header row" number.'); input.value=''; }

    // If a saved schema's headers match this file exactly (same column titles, e.g. a
    // repeat export from the same source system), auto-select it. Otherwise fall back to
    // best-guess auto-detection so the mapping still starts populated.
    const schemas = importSchemas[type] || [];
    const exactMatch = schemas.find(sc => {
      const want = Object.values(sc.mapping).filter(Boolean);
      return want.length && want.every(h => headers.some(hh => hh.toLowerCase() === h.toLowerCase()));
    });

    const mapping = {};
    if(exactMatch){
      IMPORT_FIELDS[type].forEach(f => {
        const wanted = exactMatch.mapping[f.key];
        mapping[f.key] = wanted && headers.some(h => h.toLowerCase() === wanted.toLowerCase())
          ? headers.find(h => h.toLowerCase() === wanted.toLowerCase())
          : '';
      });
    } else {
      IMPORT_FIELDS[type].forEach(f => { mapping[f.key] = guessHeader(headers, f.aliases); });
    }

    pendingImport = { type, grid, headerRow, headers, rows, mapping, schemaId: exactMatch ? exactMatch.id : '', schemaNameInput: '' };
    render();
  }catch(e){
    render(); showNotice('err','Could not read file: ' + e.message);
  }
  input.value = '';
}
// Called when the user picks a different "which row has the titles" value — re-derives
// headers/rows from the already-loaded grid (no re-upload needed) and re-applies whichever
// saved schema was active, or re-guesses the mapping from scratch otherwise.
function setImportHeaderRow(n){
  if(!pendingImport) return;
  const grid = pendingImport.grid;
  const headerRow = Math.max(1, Math.min(parseInt(n,10) || 1, grid.length));
  const { headers, rows } = deriveHeadersAndRows(grid, headerRow);
  pendingImport.headerRow = headerRow;
  pendingImport.headers = headers;
  pendingImport.rows = rows;

  const type = pendingImport.type;
  const schemas = importSchemas[type] || [];
  const currentSchema = schemas.find(s => String(s.id) === String(pendingImport.schemaId));
  const mapping = {};
  if(currentSchema){
    IMPORT_FIELDS[type].forEach(f => {
      const wanted = currentSchema.mapping[f.key];
      mapping[f.key] = wanted && headers.some(h => h.toLowerCase() === wanted.toLowerCase())
        ? headers.find(h => h.toLowerCase() === wanted.toLowerCase())
        : '';
    });
  } else {
    IMPORT_FIELDS[type].forEach(f => { mapping[f.key] = guessHeader(headers, f.aliases); });
  }
  pendingImport.mapping = mapping;
  render();
}
function setImportMapping(key, val){
  if(!pendingImport) return;
  pendingImport.mapping[key] = val;
  pendingImport.schemaId = ''; // hand-edited mapping no longer matches a saved schema exactly
  render();
}
function applyImportSchema(schemaId){
  if(!pendingImport) return;
  pendingImport.schemaId = schemaId;
  if(!schemaId){ render(); return; }
  const schema = (importSchemas[pendingImport.type] || []).find(s => String(s.id) === String(schemaId));
  if(!schema){ render(); return; }
  const headers = pendingImport.headers;
  IMPORT_FIELDS[pendingImport.type].forEach(f => {
    const wanted = schema.mapping[f.key];
    pendingImport.mapping[f.key] = wanted && headers.some(h => h.toLowerCase() === wanted.toLowerCase())
      ? headers.find(h => h.toLowerCase() === wanted.toLowerCase())
      : '';
  });
  render();
}
function setSchemaNameInput(val){
  if(!pendingImport) return;
  pendingImport.schemaNameInput = val;
}
async function saveCurrentImportSchema(){
  if(!pendingImport) return;
  const name = (pendingImport.schemaNameInput || '').trim();
  if(!name){ showNotice('err','Give the schema a name before saving it.'); return; }
  const list = importSchemas[pendingImport.type];
  const existing = list.find(s => s.name.toLowerCase() === name.toLowerCase());
  const record = { id: existing ? existing.id : Date.now(), name, mapping: { ...pendingImport.mapping } };
  if(existing) Object.assign(existing, record);
  else list.push(record);
  await saveImportSchemas();
  pendingImport.schemaId = record.id;
  pendingImport.schemaNameInput = '';
  render();
  showNotice('ok', `Schema "${name}" saved — it'll be offered next time you import a ${pendingImport.type==='students'?'student':'room'} file.`);
}
async function deleteImportSchema(schemaId){
  if(!pendingImport) return;
  if(!confirm('Delete this saved schema?')) return;
  importSchemas[pendingImport.type] = (importSchemas[pendingImport.type] || []).filter(s => String(s.id) !== String(schemaId));
  await saveImportSchemas();
  if(String(pendingImport.schemaId) === String(schemaId)) pendingImport.schemaId = '';
  render();
}
function cancelImport(){ pendingImport = null; render(); }

              ${Array.from({length:previewColCount}).map((_,ci) => `<td style="padding:.3rem .5rem;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border2)">${esc(String(row[ci] ?? ''))}</td>`).join('')}
            </tr>`;
          }).join('')}
        </table>
      </div>
      <div style="font-size:.74rem;color:var(--text3);margin-top:.35rem">

    </div>

    <p style="font-size:.82rem;color:var(--text2);margin-bottom:.9rem">

    </p>
    ${schemas.length ? `

        <option value="" ${!p.schemaId ? 'selected':''}>-- Auto-detected / Custom mapping --</option>

async function confirmImport(){
  const p = pendingImport;
  if(!p) return;
  if(p.type === 'students') return confirmImportStudents(p);
  if(p.type === 'rooms') return confirmImportRooms(p);
}
async function confirmImportStudents(p){
  const m = p.mapping;
  if(!m.regno || !m.course){
    render(); showNotice('err','Please map both Reg. No. and Course / Sub. code before importing.');
    return;
  }
  let added = 0, skipped = 0, i = 0, hadGroundFloorColumn = !!m.groundFloor;
  p.rows.forEach(r => {
    i++;
    const slno = parseInt(m.slno ? r[m.slno] : '', 10) || i;
    const tidy = v => String(v ?? '').replace(/\s+/g,' ').trim();
    const regno = tidy(m.regno ? r[m.regno] : '').replace(/\s+/g,'');
    const name = tidy(m.name ? r[m.name] : '');
    const course = tidy(m.course ? r[m.course] : '');
    const subject = tidy(m.subject ? r[m.subject] : '');
    const groundFloor = m.groundFloor ? truthyFlag(r[m.groundFloor]) : false;
    if(regno !== '' && course !== ''){
      const existing = students.find(s=>s.regno.toLowerCase()===regno.toLowerCase());
      if(existing){ existing.name = name; existing.course = course; existing.subject = subject; existing.slno = slno; if(hadGroundFloorColumn) existing.groundFloor = groundFloor; }
      else students.push({ id: nextId(students), slno, regno, name, course, subject, groundFloor });
      added++;
    } else skipped++;
  });
  await saveStudents();
  pendingImport = null;
  render();
  if(added>0){
    showNotice('ok', `${added} student(s) imported/updated.${skipped ? ` (${skipped} row(s) skipped — missing Reg.No. or Course)` : ''}`);
    if(!hadGroundFloorColumn){
      if(confirm('Do any of these students need ground floor seating (e.g. physically ill or have mobility difficulty)? Click OK to mark them now — you can toggle "Ground Floor" for each student in the table below. This will be saved.')){
        showNotice('ok', `Use the "GF" toggle in the student table to mark ground-floor students.`);
      }
    }
  } else {
    showNotice('err','No valid student rows found — check your column mapping.');
  }
}
async function confirmImportRooms(p){
  const m = p.mapping;
  if(!m.name || !m.rows || !m.cols){
    render(); showNotice('err','Please map Room name, Rows and Columns before importing.');
    return;
  }
  let added = 0;
  p.rows.forEach(r => {
    const name = String((m.name ? r[m.name] : '') ?? '').trim();
    const session = String((m.session ? r[m.session] : '') ?? '').trim();
    const rc = parseInt(m.rows ? r[m.rows] : '', 10) || 0;
    const cc = parseInt(m.cols ? r[m.cols] : '', 10) || 0;
    const groundFloor = m.groundFloor ? truthyFlag(r[m.groundFloor]) : false;
    if(name !== '' && rc > 0 && cc > 0){
      rooms.push({ id: nextId(rooms), name, session, rows: rc, cols: cc, groundFloor });
      added++;
    }
  });
  await saveRooms();
  pendingImport = null;
  render();
  if(added>0) showNotice('ok', `${added} room(s) imported.`);
  else showNotice('err','No valid room rows found — check your column mapping.');
}

/* ===================== drag & swap seats ===================== */
const swapHistory = [];   // [{a,b}] — for undo
let selSeat = null;       // tap-to-swap selection {room,r,c}
const SEAT_FIELDS = ['course','regno','name','subject','groundFloor'];
function seatLookup(pos){
  const rd = (run?.allocation||[]).find(x => String(x.room.id) === String(pos.room));
  if(!rd) return null;
  const seat = rd.seats.find(x => x.row_idx === +pos.r && x.col_idx === +pos.c);
  return seat ? { rd, seat } : null;
}
function swapRaw(a,b){
  const A = seatLookup(a), B = seatLookup(b);
  if(!A || !B || A.seat === B.seat) return false;
  SEAT_FIELDS.forEach(f => { const t = A.seat[f]; A.seat[f] = B.seat[f]; B.seat[f] = t; });
  return true;
}
async function rerenderKeepScroll(){ const y = window.scrollY; await render(); window.scrollTo(0, y); }
async function moveSeat(a,b){
  const A = seatLookup(a), B = seatLookup(b);
  if(!A || !B || A.seat === B.seat) return;
  if(!A.seat.regno && !B.seat.regno) return;
  // ground-floor students must not be moved to a non-ground-floor room without a warning
  const warn = [];
  if(A.seat.regno && A.seat.groundFloor && !B.rd.room.groundFloor) warn.push(`${A.seat.regno} needs ground floor but Room ${B.rd.room.name} is not marked ground floor.`);
  if(B.seat.regno && B.seat.groundFloor && !A.rd.room.groundFloor) warn.push(`${B.seat.regno} needs ground floor but Room ${A.rd.room.name} is not marked ground floor.`);
  if(warn.length && !confirm(warn.join('\n') + '\n\nMove anyway?')){ selSeat = null; return rerenderKeepScroll(); }
  swapRaw(a,b);
  swapHistory.push({ a, b });
  selSeat = null;
  await saveRun();
  await rerenderKeepScroll();
}
async function undoSwap(){
  const last = swapHistory.pop();
  if(!last) return;
  swapRaw(last.a, last.b);
  selSeat = null;
  await saveRun();
  await rerenderKeepScroll();
}
function seatDragStart(ev, room, r, c){
  window.__drag = { room, r, c };
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', room+','+r+','+c); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}
function seatDragEnd(ev){ ev.currentTarget.classList.remove('dragging'); document.querySelectorAll('.seat.dragover').forEach(e=>e.classList.remove('dragover')); }
function seatDragOver(ev){ ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; ev.currentTarget.classList.add('dragover'); }
function seatDragLeave(ev){ ev.currentTarget.classList.remove('dragover'); }
function seatDrop(ev, room, r, c){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  const from = window.__drag; window.__drag = null;
  if(from) moveSeat(from, { room, r, c });
}
function seatClick(room, r, c){
  const pos = { room, r, c };
  if(!selSeat){ selSeat = pos; return rerenderKeepScroll(); }
  if(String(selSeat.room)===String(room) && selSeat.r===r && selSeat.c===c){ selSeat = null; return rerenderKeepScroll(); }
  moveSeat(selSeat, pos);
}

function renderRoomGridCard(rd, courseColorMap){
  const room = rd.room, R = rd.R, C = rd.C;
  const byPos = {};
  rd.seats.forEach(seat => { byPos[`${seat.col_idx}_${seat.row_idx}`] = seat; });
  const filled = rd.seats.filter(s=>s.regno).length;
  const cellW = Math.max(58, Math.min(88, Math.floor(330 / Math.max(C,1))));

  let colLabels = '';
  for(let c=0;c<C;c++) colLabels += `<div class="seat-col-lbl" style="width:${cellW}px">${ALPHA[c % ALPHA.length]}</div>`;

  let rowsHtml = '';
  for(let r=0;r<R;r++){
    let cells = '';
    for(let c=0;c<C;c++){
      const seat = byPos[`${c}_${r}`];
      const sid = seatId(r,c);
      const isSel = selSeat && String(selSeat.room)===String(room.id) && selSeat.r===r && selSeat.c===c;
      const dnd = `data-room="${room.id}" ondragover="seatDragOver(event)" ondragleave="seatDragLeave(event)" ondrop="seatDrop(event,${room.id},${r},${c})" onclick="seatClick(${room.id},${r},${c})"`;
      if(seat && seat.regno){
        const col = courseColorMap[seat.course] || '#aaa';
        cells += `<div class="seat filled${isSel?' sel':''}" draggable="true" ondragstart="seatDragStart(event,${room.id},${r},${c})" ondragend="seatDragEnd(event)" ${dnd} title="Drag onto another seat to swap" style="width:${cellW}px;min-width:${cellW}px;background:${hexLight(col)};border-color:${col}">
          <div class="seat-sid">${sid}</div>
          <div class="seat-reg">${esc(seat.regno)}</div>
          <div class="seat-sub" style="background:${col}">${esc(seat.course)}</div>
        </div>`;
      } else {
        cells += `<div class="seat empty${isSel?' sel':''}" ${dnd} title="Drop a student here to move" style="width:${cellW}px;min-width:${cellW}px"><div class="seat-sid">${sid}</div></div>`;
      }
    }
    rowsHtml += `<div class="seat-row"><div class="row-lbl">${r+1}</div>${cells}</div>`;
  }

  return `
  <div class="room-card">
    <div class="room-header">Room ${esc(room.name)}${room.session ? ' ('+esc(room.session)+')' : ''}
      <span>${filled}/${R*C} seats</span></div>
    <div class="seat-grid-wrap">
      <div class="seat-col-labels">${colLabels}</div>
      ${rowsHtml}
    </div>
  </div>`;
}

async function runAllocationClick(){
  swapHistory.length = 0; selSeat = null;
  if(!rooms.length || !students.length){
    window.__allocNotice = 'Add at least one room and one student before running allocation.';
    render();
    return;
  }
  const roomsForAlgo = rooms.map(r => ({ id:r.id, name:r.name, session:r.session, rows:r.rows, cols:r.cols, groundFloor: !!r.groundFloor }));
  const studentsForAlgo = students.map(s => ({ id:s.id, regno:s.regno, name:s.name, course:s.course, subject:s.subject||'', groundFloor: !!s.groundFloor }));

  const { allocation, unplaced, groundFloorNote, quality, rescuedCount } = runFullAllocation(roomsForAlgo, studentsForAlgo, allocStrategy);
  const totalSeats = allocation.reduce((s,rd)=>s+rd.R*rd.C,0);

  // Flatten to the same shape allocate.php built for display (seats keyed by room, in original room order).
  const displayAlloc = rooms.map(room => {
    const rd = allocation.find(a => a.room.id === room.id);
    const seats = [];
    if(rd){
      rd.assigned.forEach((st, idx) => {
        const row = idx % rd.R, col = Math.floor(idx / rd.R);
        seats.push({
          row_idx: row, col_idx: col, seat_label: seatId(row,col),
          course: st ? st.course : null,
          regno: st ? st.regno : null,
          name: st ? st.name : null,
          subject: st ? (st.subject || '') : '',
          groundFloor: st ? !!st.groundFloor : false,
        });
      });
    }
    return { room: { id: room.id, name: room.name, session: examSession || room.session, groundFloor: !!room.groundFloor }, R: room.rows, C: room.cols, seats };
  }).filter(rd => rd.seats.length || true);
  // sort seats by col then row (matches original ORDER BY col_idx,row_idx) — already in that order since idx = row+col*R

  run = {
    run_at: new Date().toLocaleString(),
    total_students: students.length,
    total_seats: totalSeats,
    unplaced: unplaced.length,
    allocation: displayAlloc,
    groundFloorNote,
    strategy: allocStrategy,
    quality,
  };
  await saveRun();

  // Force a fresh publish decision for every new allocation result.
  publish = { enabled: false, mode: 'now', publishAt: null };
  await savePublish();

  let noticeMsg = unplaced.length
    ? `${unplaced.length} student(s) unplaced — insufficient room capacity.`
    : `All ${students.length} students allocated.`;
  if(rescuedCount){
    noticeMsg += ` (Backtrack rescue seated ${rescuedCount} student(s) initially left unplaced.)`;
  }
  if(groundFloorNote){
    noticeMsg += groundFloorNote.noGroundRooms
      ? ` Note: ${groundFloorNote.needed} student(s) marked for ground floor, but no rooms are flagged as ground floor — mark room(s) in Room Management.`
      : ` Ground floor: ${groundFloorNote.placedOnGround}/${groundFloorNote.needed} marked student(s) seated on ground floor.`;
  }
  window.__allocNotice = noticeMsg;
  render();
  const card = document.getElementById('pub-card');
  if(card) card.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* ===================== exports ===================== */
/* ===================== Excel export — college workbook layout =====================
   Builds ONE .xlsx laid out like the college's seating workbook, from the current allocation only:
     ROLL ............ room-wise roll list (left / right halves, Room No. merged per block)
     SEATING COUNT ... room x subject-code counts + totals (= question papers needed) + number of halls
     <room no.> ...... one seating chart per room (links to ROLL) + subject / absentee table + invigilator signature
     Faculty reqt .... invigilation duty requirement for the session (branch strengths are editable inputs)
   Cells that can be calculated are real formulas (with cached results), so edits in ROLL flow through. */
const ExcelExport = (() => {
  const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const TNR = 'Times New Roman', ARI = 'Arial';
  const thin = { style: 'thin' }, BORDER = { top: thin, left: thin, bottom: thin, right: thin };
  const GREY = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD8D8D8' } };
  const YELLOW = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF99' } };
  const colL = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const asNum = v => /^\d+$/.test(String(v)) ? Number(v) : String(v);
  const style = (c, o = {}) => {
    c.font = { name: o.font || ARI, size: o.size || 10, bold: !!o.bold, italic: !!o.italic, color: o.color ? { argb: o.color } : undefined };
    c.alignment = { horizontal: o.h || 'left', vertical: 'middle', wrapText: !!o.wrap };
    if (o.border !== false) c.border = BORDER;
    if (o.fill) c.fill = o.fill;
  };
  const sheetName = (raw, used) => {
    let n = String(raw).replace(/[\[\]:*?\/\\]/g, '-').trim().slice(0, 31) || 'Room';
    while (used.has(n.toLowerCase())) n = n.slice(0, 28) + '_' + (used.size % 100);
    used.add(n.toLowerCase()); return n;
  };

  /* ---- model: rooms -> roll blocks (left = 1st, 3rd… seat columns; right = 2nd, 4th…) ---- */
  function model() {
    const alloc = (run && run.allocation) || [];
    const subjName = {};
    alloc.forEach(rd => rd.seats.forEach(s => { if (s.course && s.subject && !subjName[s.course]) subjName[s.course] = s.subject; }));
    const rooms = []; let row = 4;
    alloc.forEach(rd => {
      const seats = rd.seats.filter(s => s.regno).sort((a, b) => a.col_idx - b.col_idx || a.row_idx - b.row_idx);
      if (!seats.length) return;
      const sides = [[], []]; seats.forEach(s => sides[s.col_idx % 2].push(s));
      const n = Math.max(sides[0].length, sides[1].length);
      rooms.push({ rd, name: String(rd.room.name), seats, sides, n, r1: row, r2: row + n - 1 });
      row += n;
    });
    const codes = [...new Set(rooms.flatMap(r => r.seats.map(s => s.course).filter(Boolean)))].sort();
    return { rooms, codes, subjName, lastRow: row - 1 };
  }
  const countIn = (room, code) => room.seats.filter(s => s.course === code).length;
  const rollRef = (room, s) => { const side = s.col_idx % 2; return `ROLL!${side ? 'I' : 'C'}${room.r1 + room.sides[side].indexOf(s)}`; };

  /* ---- ROLL ---- */
  function buildRoll(wb, M, titleLine) {
    const ws = wb.addWorksheet('ROLL', { views: [{ state: 'frozen', ySplit: 3 }] });
    [9, 6.8, 14, 27, 10.8, 38.6, 9, 6, 19.9, 22.1, 11.2, 40.2].forEach((w, i) => ws.getColumn(i + 1).width = w);
    ws.mergeCells('A1:L1'); ws.getCell('A1').value = titleLine; style(ws.getCell('A1'), { font: TNR, size: 12, bold: true, h: 'center' });
    ws.mergeCells('A2:L2'); ws.getCell('A2').value = examName || ''; style(ws.getCell('A2'), { font: TNR, size: 12, h: 'center' });
    ['Room No.', 'Sl No', 'Reg. No', 'Name', 'Sub code', 'Subject', 'Room No.', 'Sl No', 'Reg. No', 'Name', 'Sub code', 'Subject']
      .forEach((h, i) => { const c = ws.getCell(3, i + 1); c.value = h; style(c, { font: 'Calibri', size: 11, bold: true }); });
    ws.getRow(3).height = 22;
    M.rooms.forEach(room => {
      [[0, 1], [1, 7]].forEach(([side, c0]) => {
        const list = room.sides[side];
        if (room.n > 1) ws.mergeCells(room.r1, c0, room.r2, c0);
        const rc = ws.getCell(room.r1, c0); rc.value = asNum(room.name); style(rc, { font: 'Calibri', size: 11, h: 'center' });
        for (let k = 0; k < room.n; k++) {
          const r = room.r1 + k, s = list[k];
          for (let j = 1; j <= 5; j++) style(ws.getCell(r, c0 + j), { size: 10, h: j === 1 || j === 4 ? 'center' : 'left' });
          if (!s) continue;
          ws.getCell(r, c0 + 1).value = k + 1;
          ws.getCell(r, c0 + 2).value = s.regno;
          ws.getCell(r, c0 + 3).value = s.name || '';
          ws.getCell(r, c0 + 4).value = s.course || '';
          ws.getCell(r, c0 + 5).value = s.subject || M.subjName[s.course] || '';
        }
      });
    });
    ws.getCell('R3').value = 'Subjects'; ws.getColumn(18).width = 12;
    M.codes.forEach((c, i) => { ws.getCell(4 + i, 17).value = 'sub' + (i + 1); ws.getCell(4 + i, 18).value = c; });
    ws.pageSetup = { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: '3:3' };
    ws.pageSetup.printArea = `A1:L${Math.max(M.lastRow, 4)}`;
  }

  /* ---- SEATING COUNT (also the question-paper count per subject) ---- */
  function buildCount(wb, M, titleLine) {
    const ws = wb.addWorksheet('SEATING COUNT');
    const nc = M.codes.length, last = 2 + nc + 1, totCol = last, lastL = colL(last);
    ws.getColumn(1).width = 8; ws.getColumn(2).width = 12;
    for (let i = 3; i <= last; i++) ws.getColumn(i).width = 13;
    ws.mergeCells(`B1:${lastL}1`); ws.getCell('B1').value = { formula: 'ROLL!A1', result: titleLine }; style(ws.getCell('B1'), { font: TNR, size: 12, bold: true, h: 'center' });
    ws.mergeCells(`B2:${lastL}2`); ws.getCell('B2').value = 'SEATING ARRANGEMENT  GENERAL'; style(ws.getCell('B2'), { font: TNR, size: 12, bold: true, h: 'center' });
    ws.mergeCells('A3:A4'); ws.getCell('A3').value = 'Sl. No.';
    ws.mergeCells('B3:B4'); ws.getCell('B3').value = 'Room No.';
    if (nc > 1) ws.mergeCells(3, 3, 3, 2 + nc); ws.getCell(3, 3).value = 'SUBJECT CODE';
    ws.mergeCells(3, totCol, 4, totCol); ws.getCell(3, totCol).value = 'Total';
    for (let r = 3; r <= 4; r++) for (let c = 1; c <= last; c++) style(ws.getCell(r, c), { font: TNR, size: 11, bold: true, h: 'center', fill: GREY });
    M.codes.forEach((c, i) => { const x = ws.getCell(4, 3 + i); x.value = c; });
    const first = 5; let r = first;
    M.rooms.forEach((room, ri) => {
      ws.getCell(r, 1).value = ri + 1; ws.getCell(r, 2).value = asNum(room.name);
      M.codes.forEach((code, i) => {
        const L = colL(3 + i);
        ws.getCell(r, 3 + i).value = { formula: `COUNTIF(ROLL!$E$${room.r1}:$E$${room.r2},${L}$4)+COUNTIF(ROLL!$K$${room.r1}:$K$${room.r2},${L}$4)`, result: countIn(room, code) };
      });
      ws.getCell(r, totCol).value = { formula: `SUM(C${r}:${colL(2 + nc)}${r})`, result: room.seats.length };
      for (let c = 1; c <= last; c++) style(ws.getCell(r, c), { font: TNR, size: 11, h: 'center', bold: c === 2 || c === totCol });
      r++;
    });
    const lastRoomRow = r - 1, totRow = r;
    ws.getCell(totRow, 2).value = 'Total';
    M.codes.forEach((code, i) => { const L = colL(3 + i); ws.getCell(totRow, 3 + i).value = { formula: `SUM(${L}${first}:${L}${lastRoomRow})`, result: M.rooms.reduce((a, x) => a + countIn(x, code), 0) }; });
    const grand = M.rooms.reduce((a, x) => a + x.seats.length, 0);
    ws.getCell(totRow, totCol).value = { formula: `SUM(${colL(totCol)}${first}:${colL(totCol)}${lastRoomRow})`, result: grand };
    for (let c = 1; c <= last; c++) style(ws.getCell(totRow, c), { font: TNR, size: 11, bold: true, h: 'center', fill: GREY });
    ws.getCell(totRow + 1, 2).value = 'Question papers required = Total row (one per student, per subject code)';
    style(ws.getCell(totRow + 1, 2), { font: TNR, size: 10, italic: true, border: false });
    const hallsRow = totRow + 3;
    ws.getCell(hallsRow, 2).value = 'Number of Halls'; style(ws.getCell(hallsRow, 2), { font: TNR, size: 12, bold: true, border: false });
    ws.mergeCells(hallsRow, 2, hallsRow, 3);
    ws.getCell(hallsRow, 4).value = { formula: `COUNT(A${first}:A${lastRoomRow})`, result: M.rooms.length }; style(ws.getCell(hallsRow, 4), { font: TNR, size: 12, bold: true, h: 'center' });
    ws.pageSetup = { orientation: 'portrait', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
    return { totalCell: `'SEATING COUNT'!${colL(totCol)}${totRow}`, hallsCell: `'SEATING COUNT'!D${hallsRow}`, grand, halls: M.rooms.length };
  }

  /* ---- one sheet per room ---- */
  function buildRoom(wb, M, room, name, titleLine) {
    const ws = wb.addWorksheet(name);
    const R = room.rd.R, C = Math.max(room.rd.C, 4), seatAt = (r, c) => room.seats.find(s => s.row_idx === r && s.col_idx === c);
    for (let c = 1; c <= C; c++) ws.getColumn(c).width = 17;
    const span = colL(C);
    ws.mergeCells(`A1:${span}1`); ws.getCell('A1').value = { formula: 'ROLL!A1', result: titleLine }; style(ws.getCell('A1'), { font: 'Calibri', size: 12, bold: true, h: 'center', border: false });
    ws.mergeCells(`A2:${span}2`); ws.getCell('A2').value = asNum(room.name); style(ws.getCell('A2'), { font: TNR, size: 12, bold: true, h: 'center' });
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const lab = ws.getCell(3 + 2 * r, c + 1), val = ws.getCell(4 + 2 * r, c + 1);
      if (c < room.rd.C) lab.value = seatId(r, c);
      style(lab, { font: TNR, size: 12, bold: true, h: 'center', fill: GREY });
      const s = c < room.rd.C ? seatAt(r, c) : null;
      if (s) val.value = { formula: rollRef(room, s), result: s.regno };
      style(val, { font: TNR, size: 12, bold: true, h: 'center' }); ws.getRow(4 + 2 * r).height = 24;
    }
    const head = 5 + 2 * R, counts = {};
    room.seats.forEach(s => { counts[s.course || ''] = (counts[s.course || ''] || 0) + 1; });
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    ['Subject Code', 'Total students', 'Absentees', 'Total present'].forEach((h, i) => { const c = ws.getCell(head, i + 1); c.value = h; style(c, { font: 'Calibri', size: 11, bold: true, h: 'center', fill: GREY, wrap: true }); });
    entries.forEach(([code, n], i) => {
      const r = head + 1 + i;
      ws.getCell(r, 1).value = code;
      ws.getCell(r, 2).value = { formula: `COUNTIF(ROLL!$E$${room.r1}:$E$${room.r2},$A${r})+COUNTIF(ROLL!$K$${room.r1}:$K$${room.r2},$A${r})`, result: n };
      ws.getCell(r, 4).value = { formula: `IF(C${r}="","",B${r}-C${r})`, result: '' };
      for (let c = 1; c <= 4; c++) style(ws.getCell(r, c), { font: 'Calibri', size: 11, h: 'center' });
      ws.getCell(r, 3).fill = YELLOW;
    });
    const sig = head + entries.length + 2;
    ws.mergeCells(sig, 1, sig, 2); ws.getCell(sig, 1).value = 'Name and Signature of invigilator';
    ws.mergeCells(sig, 3, sig, 4); style(ws.getCell(sig, 1), { font: TNR, size: 12, bold: true, h: 'center', wrap: true }); style(ws.getCell(sig, 3));
    ws.getRow(sig).height = 30;
    ws.mergeCells(sig + 1, 1, sig + 1, 4); ws.getCell(sig + 1, 1).value = 'Note: Circle the absentee register numbers';
    style(ws.getCell(sig + 1, 1), { font: 'Calibri', size: 12, bold: true, h: 'center', border: false });
    ws.pageSetup = { orientation: 'portrait', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 };
  }

  /* ---- Faculty reqt ---- */
  function buildFaculty(wb, cnt, sessionLabel) {
    const ws = wb.addWorksheet('Faculty reqt');
    [14, 16, 14, 14].forEach((w, i) => ws.getColumn(i + 1).width = w);
    ws.mergeCells('A1:D1'); ws.getCell('A1').value = 'Government College of Engineering Kannur'; style(ws.getCell('A1'), { font: TNR, size: 12, bold: true, h: 'center' });
    ws.mergeCells('A2:D2'); ws.getCell('A2').value = 'Invigilation Duty requirement'; style(ws.getCell('A2'), { font: TNR, size: 12, bold: true, h: 'center' });
    ws.getCell('A3').value = 'Session'; ws.mergeCells('B3:D3'); ws.getCell('B3').value = sessionLabel;
    ws.getCell('A4').value = 'Students'; ws.mergeCells('B4:D4'); ws.getCell('B4').value = { formula: cnt.totalCell, result: cnt.grand };
    ws.getCell('A5').value = 'Halls'; ws.mergeCells('B5:D5'); ws.getCell('B5').value = { formula: cnt.hallsCell, result: cnt.halls };
    for (let r = 3; r <= 5; r++) { style(ws.getCell(r, 1), { font: TNR, size: 11, bold: true, fill: GREY }); style(ws.getCell(r, 2), { font: TNR, size: 11, h: 'center' }); style(ws.getCell(r, 3)); style(ws.getCell(r, 4)); }
    ['Branch', 'Faculty strength', 'Invigilators', 'Relievers'].forEach((h, i) => { const c = ws.getCell(7, i + 1); c.value = h; style(c, { font: TNR, size: 11, bold: true, h: 'center', fill: GREY, wrap: true }); });
    const branches = [['ECE', 24], ['CE', 18], ['EEE', 19], ['CSE', 14], ['ME', 21], ['ASM', 10]], tot = branches.reduce((a, b) => a + b[1], 0);
    branches.forEach(([b, n], i) => {
      const r = 8 + i;
      ws.getCell(r, 1).value = b; ws.getCell(r, 2).value = n;
      ws.getCell(r, 3).value = { formula: `ROUND($B${r}/$B$14*$B$5,0)`, result: Math.round(n / tot * cnt.halls) };
      for (let c = 1; c <= 4; c++) style(ws.getCell(r, c), { font: TNR, size: 11, h: 'center' });
      ws.getCell(r, 2).font = { name: TNR, size: 11, color: { argb: 'FF0000FF' } }; ws.getCell(r, 4).fill = YELLOW;
    });
    const inv = branches.reduce((a, [, n]) => a + Math.round(n / tot * cnt.halls), 0);
    ws.getCell('A14').value = 'Total'; ws.getCell('B14').value = { formula: 'SUM(B8:B13)', result: tot };
    ws.getCell('C14').value = { formula: 'SUM(C8:C13)', result: inv }; ws.getCell('D14').value = { formula: 'SUM(D8:D13)', result: 0 };
    for (let c = 1; c <= 4; c++) style(ws.getCell(14, c), { font: TNR, size: 11, bold: true, h: 'center', fill: GREY });
    ws.mergeCells('A16:D17');
    ws.getCell('A16').value = 'Blue = faculty strength per branch (edit as needed). Invigilators = branch share of the halls above, rounded, so the total may differ from the hall count by 1–2. Yellow cells (Relievers) are for manual entry.';
    style(ws.getCell('A16'), { font: 'Calibri', size: 9, italic: true, wrap: true, border: false });
    ws.getCell('A16').alignment = { vertical: 'top', wrapText: true };
  }

  function build() {
    const M = model();
    if (!M.rooms.length) throw new Error('No seated students to export — run the allocation first.');
    const titleLine = [dotDate(examDate), examSession].filter(Boolean).join(' ') || 'SEATING ARRANGEMENT';
    const wb = new ExcelJS.Workbook(); wb.creator = 'Exam Seating Allocator'; wb.created = new Date();
    wb.calcProperties = { fullCalcOnLoad: true };
    const used = new Set(['roll', 'seating count', 'faculty reqt']);
    buildRoll(wb, M, titleLine);
    const cnt = buildCount(wb, M, titleLine);
    M.rooms.forEach(room => buildRoom(wb, M, room, sheetName(room.name, used), titleLine));
    buildFaculty(wb, cnt, titleLine);
    return { wb, rooms: M.rooms.length, students: cnt.grand };
  }

  async function download() {
    if (!run) return;
    try {
      if (typeof ExcelJS === 'undefined') throw new Error('Excel library failed to load — check your internet connection and reload the page.');
      const { wb, rooms, students } = build();
      const buf = await wb.xlsx.writeBuffer();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: MIME })); a.download = exportFileName('xlsx');
      document.body.appendChild(a); a.click(); a.remove();
      window.__allocNotice = `Excel downloaded (${a.download}) — ROLL, SEATING COUNT, ${rooms} room sheet(s) and Faculty reqt for ${students} students.`;
    } catch (e) { console.error(e); window.__allocNotice = 'Excel export failed: ' + e.message; }
    render();
  }
  return { build, download };
})();
async function downloadExcelList() { return ExcelExport.download(); }

// Names exported files after the exam date (falls back to today's date if no exam date is
// set), e.g. "2026-09-12.xls" / "2026-09-12.html" — so files from different exam dates don't
// overwrite each other and are easy to sort/find later.
function exportFileName(ext){
  const d = examDate || new Date().toISOString().slice(0,10);
  return `${d}${examSession ? '-' + examSession : ''}.${ext}`;
}

/* ===================== ONE QR for all rooms + phone viewer ===================== */
function _b64urlEnc(u8){
  let bin=''; for(let i=0;i<u8.length;i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function _b64urlDec(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str += '=';
  const bin = atob(str); const u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
// Every room packed into one short string: [date, [[name,session,R,C,"regno;regno;;..."],...]] -> deflate -> base64url
// (cells are stored row-major, so the seat label A1/B3/... is worked out from the position, not stored)
function encodeAll(allocation){
  const rooms = allocation.map(rd => {
    const cells = new Array(rd.R*rd.C).fill('');
    rd.seats.forEach(seat => { if(seat.regno) cells[seat.row_idx*rd.C + seat.col_idx] = String(seat.regno).replace(/[;]/g,' '); });
    return [rd.room.name, rd.room.session||'', rd.R, rd.C, cells.join(';')];
  });
  const json = JSON.stringify([examDate||'', rooms]);
  return _b64urlEnc(pako.deflate(new TextEncoder().encode(json), { level:9 }));
}
function decodeAll(str){
  const [date, rooms] = JSON.parse(pako.inflate(_b64urlDec(str), { to:'string' }));
  return { date, rooms: rooms.map(([name,session,R,C,cellStr]) => {
    const cells = cellStr.split(';');
    const seats = [];
    for(let r=0;r<R;r++) for(let c=0;c<C;c++) seats.push({ label: seatId(r,c), regno: cells[r*C+c] || '' });
    return { name, session, R, C, seats };
  }) };
}
// Returns { svg } or { err } — one QR code that covers all rooms.
function buildAllRoomsQr(allocation){
  if(typeof qrcode === 'undefined' || typeof pako === 'undefined')
    return { err: 'The QR / compression libraries could not be loaded (internet is needed once to load them), so the QR code was left out.' };
  let base = String(viewerUrl||'').trim().replace(/#.*$/,'');
  if(!base) return { err: 'No QR Viewer Link is set, so the QR code was left out.' };
  if(!/^https?:\/\//i.test(base)) base = 'https://' + base;
  try{
    const qr = qrcode(0, 'L');
    qr.addData(base + '#a=' + encodeAll(allocation), 'Byte');
    qr.make();
    return { svg: qr.createSvgTag({ cellSize:2, margin:0, scalable:true }) };
  }catch(e){
    return { err: 'There is too much seating data to fit in one QR code (roughly 600 students is the limit), so the QR code was left out.' };
  }
}
// Runs when this file is opened from the QR code (address ends in #a=...): search any register number.

  <div class="v-wrap">
    <input class="v-search" id="v-q" type="search" placeholder="Type your register number" autocomplete="off">

    for(let r=0;r<rm.R;r++){ g+='<tr>'; for(let c=0;c<rm.C;c++){
