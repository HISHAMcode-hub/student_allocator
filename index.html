}

/* ===================== student-wise seat list PDF ===================== */
function printStudentList(){
  if(!run) return;
  const list = [];
  run.allocation.forEach(rd => rd.seats.forEach(s => {
    if(s.regno) list.push({ regno:String(s.regno), room:rd.room.name, session:rd.room.session||'', seat:seatId(s.row_idx, s.col_idx) });
  }));
  list.sort((a,b)=>a.regno.localeCompare(b.regno, undefined, { numeric:true, sensitivity:'base' }));
  const PER_COL = 46, PER_PAGE = PER_COL*2;
  const nPages = Math.max(1, Math.ceil(list.length/PER_PAGE));
  const tbl = rows => `<table class="sl"><tr><th>Reg. No.</th><th>Room</th><th>Seat</th></tr>${rows.map(r=>`<tr><td class="rg">${esc(r.regno)}</td><td>Room ${esc(r.room)}${r.session?` <span class="ss">${esc(r.session)}</span>`:''}</td><td class="st">${esc(r.seat)}</td></tr>`).join('')}</table>`;
  let pages = '';
  for(let p=0;p<nPages;p++){
    const chunk = list.slice(p*PER_PAGE, (p+1)*PER_PAGE);
    pages += `
    <div class="page">
      <div class="band">
        <div class="band-top">
          <img class="band-logo" src="${COLLEGE_LOGO}" alt="College logo">
          <div class="band-titles"><h1>GOVT. COLLEGE OF ENGINEERING, KANNUR</h1><p class="band-sub2">STUDENT-WISE SEATING LIST</p></div>
          <div class="band-logo-spacer"></div>
        </div>
        ${dateLineHtml()}
      </div>
      <div class="cols">${tbl(chunk.slice(0,PER_COL))}${chunk.length>PER_COL ? tbl(chunk.slice(PER_COL)) : '<div></div>'}</div>
      <div class="footer-band"><span>Total students: ${list.length}</span><span>Page ${p+1} of ${nPages}</span></div>
    </div>`;
  }
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(exportFileName('pdf').replace(/\.pdf$/,''))}-students</title>
  <style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;-webkit-print-color-adjust:economy;print-color-adjust:economy}
  .page{page-break-after:always;padding:10mm 10mm}
  .page:last-child{page-break-after:auto}
  .band{padding:4px 2px 6px;border-bottom:1.5px solid #000}
  .band-top{display:flex;align-items:center;gap:12px;justify-content:center}
  .band-logo,.band-logo-spacer{width:38px;height:38px;flex-shrink:0}
  .band-logo{object-fit:contain;filter:grayscale(1) contrast(1.2)}
  .band-titles{text-align:center;flex:1}
  .band h1{font-size:16px;letter-spacing:.03em}
  .band-sub2{font-size:10px;margin-top:3px;letter-spacing:.05em}
  .band-date{text-align:center;font-size:14px;font-weight:bold;margin-top:5px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 0}
  table.sl{width:100%;border-collapse:collapse;font-size:11.5px}
  table.sl th{text-align:left;padding:5px 7px;border-bottom:1px solid #000;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  table.sl td{padding:0 7px;height:5.6mm;border-bottom:.4px solid #aaa}
  td.st{text-align:center}
  .ss{font-size:9px}
  .footer-band{border-top:.5px solid #000;font-size:9px;padding:6px 2px;display:flex;justify-content:space-between}
  .toolbar{padding:10px 14px}
  @media print{.toolbar{display:none}}
  </style></head><body>
  <div class="toolbar"><button onclick="window.print()" style="padding:8px 16px;font-weight:bold;cursor:pointer">🖨 Print / Save as PDF</button></div>
  ${pages}
  </body></html>`;
  const w = window.open('', '_blank');
  w.document.open(); w.document.write(html); w.document.close();
}

function dotDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso || '');
}
/* Two PDFs, both laid out like the college's Excel sheets (ROLL / SEATING COUNT / one chart per room):
   - Display PDF : one seating chart per room (seat label + reg. no.), with the QR code. For notice boards.
   - As-is PDF   : roll list + seating count + one chart per room with the subject / absentee table and invigilator signature. */
function printExport(mode){
  mode = (mode === 'display') ? 'display' : 'asis';
  const isDisplay = mode === 'display';
  if(!run) return;
  // One QR code (same everywhere) covering all rooms — Display PDF only.
  let qrSvg = '';
  if(isDisplay && includeQr){
    const q = buildAllRoomsQr(run.allocation || []);
    if(q.svg) qrSvg = q.svg;
    else if(!confirm(q.err + '\n\nPrint the Display PDF without a QR code?')) return;
  }
  const { allocation, courses } = buildDisplayAllocation();
  const titleLine = [dotDate(examDate), examSession].filter(Boolean).join(' ');
  const subjName = {};
  allocation.forEach(rd => rd.seats.forEach(s => { if(s.course && s.subject && !subjName[s.course]) subjName[s.course] = s.subject; }));
  const seatAt = (rd, r, c) => rd.seats.find(s => s.row_idx === r && s.col_idx === c);

  const header = (withQr) => `
  <div class="band${withQr && qrSvg ? ' hasqr' : ''}">
    <div class="band-top">
      <img class="band-logo" src="${COLLEGE_LOGO}" alt="">
      <div class="band-titles">
        <div class="clg">GOVT. COLLEGE OF ENGINEERING, KANNUR</div>
        <div class="dt">${esc(titleLine || 'SEATING ARRANGEMENT')}</div>
        ${examName ? `<div class="en">${esc(examName)}</div>` : ''}
      </div>
    </div>
    ${withQr && qrSvg ? `<div class="band-qr"><span class="qrtxt">Scan to find<br>your room<br>&amp; seat</span><span class="qrbox"><span class="qr">${qrSvg}</span></span></div>` : ''}
  </div>`;

  /* ---------- one seating chart per room ---------- */
  const chartPage = rd => {
    const room = rd.room, R = rd.R, C = rd.C;
    const used = rd.seats.filter(s => s.regno).length;
    const counts = {};
    rd.seats.forEach(s => { if(s.regno) counts[s.course] = (counts[s.course] || 0) + 1; });
    const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
    const multi = entries.length > 1;   // B&W: course code is printed in each seat instead of a colour
    const avail = isDisplay ? 204 : 138;                       // mm available for the grid
    const rowH = Math.max(6.5, Math.min(isDisplay ? 30 : 18, (avail - (R + 1) * 2.2) / Math.max(R, 1)));
    const compact = rowH < 12;
    // font size that keeps the longest reg. no. on ONE line inside a cell
    const cellW = (190 - 4 - (C + 1) * 2.2) / Math.max(C, 1);          // mm
    const maxLen = Math.max(8, ...rd.seats.map(x => String(x.regno || '').length));
    const inner = cellW - 6 - (compact ? (multi ? 18 : 7) : 0);                         // minus border/padding (and the inline label)
    const fs = Math.max(7, Math.min(isDisplay ? 17 : 13.5, (inner / (maxLen * 0.64)) * 3.78));
    let rows = '';
    for(let r = 0; r < R; r++){
      let cells = '';
      for(let c = 0; c < C; c++){
        const seat = seatAt(rd, r, c), sid = seatId(r, c);
        if(seat && seat.regno){
          const cc = multi ? '<span class="cc">' + esc(seat.course || '') + '</span>' : '';
          cells += `<td class="${compact ? 'cp' : ''}"><span class="sl">${sid}${cc}</span><span class="rg">${esc(seat.regno)}</span></td>`;
        } else {
          cells += `<td class="em"><span class="sl">${sid}</span></td>`;
        }
      }
      rows += `<tr style="height:${rowH.toFixed(1)}mm">${cells}</tr>`;
    }
    const legend = entries.map(([c,n]) => `<span class="chip"><b>${esc(c)}</b> · ${n}</span>`).join('');
    const attn = isDisplay ? '' : `
      <div class="attn-wrap">
        <table class="attn">
          <tr><th>Subject Code</th><th>Total students</th><th>Absentees</th><th>Total present</th></tr>
          ${entries.map(([c,n]) => `<tr><td>${esc(c)}</td><td class="c">${n}</td><td></td><td></td></tr>`).join('')}
          <tr class="sig"><td>Name and Signature of invigilator</td><td colspan="3"></td></tr>
        </table>
        <div class="note">Note: Circle the absentee register numbers</div>
      </div>`;
    return `
    <section class="page chart">
      ${header(true)}
      <div class="roomstrip"><span class="rl">ROOM</span><span class="rn">${esc(room.name)}</span><span class="meta">${used} students</span></div>
      <div class="legend">${legend}</div>
      <table class="seatgrid" style="--fs:${fs.toFixed(1)}px">${rows}</table>
      ${attn}
      <div class="footer"><span>Govt. College of Engineering, Kannur</span><span>Seats: ${used}/${R*C}</span></div>
    </section>`;
  };

  /* ---------- roll list (As-is PDF): two blocks per room — odd columns left, even columns right ---------- */
  let rollBody = '';
  allocation.forEach(rd => {
    const L = [], Rt = [];
    for(let c = 0; c < rd.C; c++) for(let r = 0; r < rd.R; r++){
      const st = seatAt(rd, r, c);
      if(st && st.regno) (c % 2 === 0 ? L : Rt).push(st);
    }
    const n = Math.max(L.length, Rt.length);
    if(!n) return;
    const half = (st, i) => st
      ? `<td class="c">${i + 1}</td><td class="rgn">${esc(st.regno)}</td><td>${esc(st.name || '')}</td><td class="c">${esc(st.course || '')}</td><td>${esc(st.subject || subjName[st.course] || '')}</td>`
      : '<td></td><td></td><td></td><td></td><td></td>';
    let rows = '';
    for(let i = 0; i < n; i++){
      const rno = `<td class="rno" rowspan="${n}">${esc(rd.room.name)}</td>`;
      rows += `<tr>${i === 0 ? rno : ''}${half(L[i], i)}${i === 0 ? rno : ''}${half(Rt[i], i)}</tr>`;
    }
    rollBody += `<tbody>${rows}</tbody>`;
  });
  const colgroup = '<colgroup>' + ['4','3','9.5','14','6.5','13'].concat(['4','3','9.5','14','6.5','13']).map(w => `<col style="width:${w}%">`).join('') + '</colgroup>';
  const rollPage = `
    <section class="page roll">
      ${header(false)}
      <table class="rolltbl">${colgroup}
        <thead><tr>${['Room No.','Sl No','Reg. No','Name','Sub code','Subject'].map(h => `<th>${h}</th>`).join('')}${['Room No.','Sl No','Reg. No','Name','Sub code','Subject'].map(h => `<th>${h}</th>`).join('')}</tr></thead>
        ${rollBody}
      </table>
    </section>`;

  /* ---------- seating count (As-is PDF): room x subject code ---------- */
  const codes = [...new Set(allocation.flatMap(rd => rd.seats.map(s => s.course).filter(Boolean)))].sort();
  const colTotals = {}; let grand = 0, hallCount = 0, countRows = '';
  allocation.forEach(rd => {
    const cnt = {}; let tot = 0;
    rd.seats.forEach(s => { if(s.regno){ cnt[s.course] = (cnt[s.course] || 0) + 1; tot++; } });
    if(!tot) return;
    hallCount++; grand += tot;
    codes.forEach(c => { colTotals[c] = (colTotals[c] || 0) + (cnt[c] || 0); });
    countRows += `<tr><td class="c">${hallCount}</td><td class="c b">${esc(rd.room.name)}</td>${codes.map(c => `<td class="c">${cnt[c] || ''}</td>`).join('')}<td class="c b">${tot}</td></tr>`;
  });
  const countPage = `
    <section class="page roll">
      ${header(false)}
      <h3 class="ct">SEATING COUNT</h3>
      <table class="counttbl">
        <tr><th rowspan="2">Sl. No.</th><th rowspan="2">Room No.</th><th colspan="${codes.length}">SUBJECT CODE</th><th rowspan="2">Total</th></tr>
        <tr>${codes.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
        ${countRows}
        <tr class="tot"><td></td><td class="c">Total</td>${codes.map(c => `<td class="c">${colTotals[c] || 0}</td>`).join('')}<td class="c">${grand}</td></tr>
      </table>
      <p class="halls">Number of Halls: <b>${hallCount}</b></p>
    </section>`;

  /* ---------- Display PDF: closing page with one big QR ---------- */
  const qrPage = (isDisplay && qrSvg) ? `
    <section class="page chart qrpage">
      ${header(false)}
      <div class="bigqr-wrap">
        <div class="bigqr-title">Find your room &amp; seat</div>
        <div class="bigqr-sub">Scan the QR code with your phone camera and enter your register number</div>
        <div class="bigqr">${qrSvg}</div>
      </div>
    </section>` : '';

  const body = isDisplay
    ? allocation.map(chartPage).join('') + qrPage
    : rollPage + countPage + allocation.map(chartPage).join('');

  const printHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(exportFileName('pdf').replace(/\.pdf$/,''))}${isDisplay ? '-display' : '-asis'}</title>
  <style>
  @page chart{size:A4 portrait;margin:8mm}
  @page roll{size:A4 landscape;margin:8mm}
  *{box-sizing:border-box;margin:0;padding:0}
  /* Ink-saver: black on white only, no fills, hairline rules */
  body{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;-webkit-print-color-adjust:economy;print-color-adjust:economy}
  .page{break-after:page}
  .page:last-child{break-after:auto}
  .page.chart{page:chart}
  .page.roll{page:roll}
  .toolbar{padding:10px 14px}
  @media print{.toolbar{display:none}}
  .band{position:relative;padding:4px 2px 6px;border-bottom:1.5px solid #000}
  .band-top{display:flex;align-items:center;gap:12px}
  .band-logo{width:38px;height:38px;object-fit:contain;flex-shrink:0;filter:grayscale(1) contrast(1.2)}
  .band-titles{flex:1;text-align:center}
  .clg{font-size:11px;letter-spacing:.09em}
  .dt{font-size:24px;font-weight:bold;letter-spacing:.05em;margin-top:2px}
  .en{font-size:11.5px;margin-top:2px}
  .band.hasqr{min-height:29mm}
  .band.hasqr .band-top{padding-right:52mm}
  .band-qr{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
  .qrtxt{font-size:11px;font-weight:bold;line-height:1.3;text-align:right}
  .qrbox{display:block;width:25mm;background:#fff;padding:1.2mm;flex-shrink:0}
  .qr{display:block}
  .qr svg{width:100%;height:auto;display:block}
  .roomstrip{display:flex;align-items:center;justify-content:center;gap:12px;border-bottom:1px solid #000;padding:6px 14px}
  .rl{font-size:12px;letter-spacing:.22em;font-weight:bold}
  .rn{font-size:30px;font-weight:bold;padding:0 18px;border-radius:8px;line-height:1.35;border:2px solid #000}
  .meta{font-size:11px}
  .legend{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding:6px 14px 2px}
  .chip{font-size:10px;border:1px solid #000;padding:1px 9px;border-radius:9px}
  table.seatgrid{width:calc(100% - 4mm);margin:0 2mm;border-collapse:separate;border-spacing:2.2mm;table-layout:fixed}
  table.seatgrid td{border:.8px solid #000;border-radius:4px;padding:1mm 2mm;vertical-align:middle;overflow:hidden}
  table.seatgrid td.em{border:.6px dashed #aaa}
  .sl{display:flex;justify-content:space-between;font-size:8.5px;color:#333}
  .cc{font-size:7px;margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rg{display:block;font-size:var(--fs,12px);font-weight:bold;white-space:nowrap;letter-spacing:.01em}
  td.cp .sl,td.cp .rg{display:inline}
  td.cp .sl{margin-right:6px}
  td.cp .cc{margin-left:3px}
  .dsp .sl{font-size:10px}
  .attn-wrap{padding:3mm 4mm 0;break-inside:avoid}
  table.attn{width:68%;border-collapse:collapse;font-size:11px}
  table.attn th,table.attn td{border:1px solid #000;padding:6px 8px;text-align:left}
  table.attn td{height:8mm}
  table.attn td.c{text-align:center}
  table.attn tr.sig td{height:14mm;font-weight:bold}
  .note{font-size:11px;font-weight:bold;margin-top:5px}
  .footer{display:flex;justify-content:space-between;border-top:.5px solid #000;font-size:9px;padding:4px 2px;margin-top:3mm}
  table.rolltbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8px;margin-top:3mm}
  table.rolltbl th{border:1px solid #000;padding:1.5mm;font-size:8px}
  table.rolltbl td{border:.4px solid #888;padding:.9mm 1.5mm;vertical-align:middle;overflow-wrap:anywhere}
  table.rolltbl td.c{text-align:center}
  table.rolltbl td.rgn{font-size:9px}
  table.rolltbl td.rno{font-size:13px;font-weight:bold;text-align:center;border:1px solid #000}
  table.rolltbl tbody{break-inside:avoid}
  table.rolltbl tbody tr:first-child td{border-top:1px solid #000}
  table.rolltbl tbody tr:last-child td{border-bottom:1px solid #000}
  h3.ct{text-align:center;font-size:15px;letter-spacing:.12em;margin:4mm 0 3mm}
  table.counttbl{margin:0 auto;border-collapse:collapse;font-size:11px;min-width:60%}
  table.counttbl th{border:1px solid #000;padding:5px 9px}
  table.counttbl td{border:.4px solid #888;padding:5px 9px}
  table.counttbl td.c{text-align:center}
  table.counttbl td.b{font-weight:bold}
  table.counttbl tr.tot td{font-weight:bold;border-top:1.5px solid #000}
  .halls{text-align:center;margin-top:4mm;font-size:12px}
  .bigqr-wrap{text-align:center;padding:14mm 10mm 0}
  .bigqr-title{font-size:30px;font-weight:bold}
  .bigqr-sub{font-size:15px;margin:6px 0 14mm}
  .bigqr{width:130mm;margin:0 auto;padding:5mm;border:1px solid #000;border-radius:6px}
  .bigqr svg{width:100%;height:auto;display:block}
  </style></head><body class="${isDisplay ? 'dsp' : ''}">
  <div class="toolbar"><button onclick="window.print()" style="padding:8px 16px;font-weight:bold;cursor:pointer">🖨 Print / Save as PDF</button></div>
  ${body}
  </body></html>`;

  const w = window.open('', '_blank');
  w.document.open(); w.document.write(printHtml); w.document.close();
}

/* ===================== database reset ===================== */
async function resetDatabase(){
  if(!confirm('This deletes ALL rooms, students, and the allocation result stored in this browser. Continue?')) return;
  rooms = []; students = []; run = null; examDate = ''; examSession = ''; examName = ''; dbSet('exam_session',''); dbSet('exam_name',''); publish = { enabled: false, mode: 'now', publishAt: null };
  await Promise.all([saveRooms(), saveStudents(), saveRun(), saveExamDate(), savePublish()]);
  render();
}

/* ===================== nav + boot ===================== */
function go(p){ page = p; editRoomId = null; editStudentId = null; render(); }
document.querySelectorAll('nav.main-nav a').forEach(a => a.addEventListener('click', () => go(a.dataset.nav)));

(async function boot(){
  if(/^#a=/.test(location.hash)){ renderViewer(); return; }
  await loadAll();
  render();
})();
</script>
